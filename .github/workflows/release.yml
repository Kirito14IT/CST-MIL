name: Release checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  asset-free-tests:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      MPLBACKEND: Agg
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked Python development environment
        working-directory: cst_mil
        run: |
          python -m pip install uv
          uv sync --frozen --group dev
      - name: Synthetic Python and portable deployment tests
        working-directory: cst_mil
        run: >-
          uv run --frozen --group dev pytest
          tests/test_data.py tests/test_model.py tests/test_pipeline.py
          tests/test_semantic_patent_model.py tests/test_semantic_patent_topics.py
          tests/test_portable_deployment.py tests/test_baseline_setup.py
      - name: Install UI dependencies
        working-directory: 计算机项目综合开发创新实践/app
        run: npm ci
      - name: Type check and build UI
        working-directory: 计算机项目综合开发创新实践/app
        run: npm run build
      - name: Asset-free Node contracts
        working-directory: 计算机项目综合开发创新实践/app
        run: npx tsx --test tests/ui-source.test.ts tests/portable-deployment.test.ts
